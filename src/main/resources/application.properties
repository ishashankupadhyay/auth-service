spring.application.name=auth-service
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth-service}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=shadow
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration (Keys injected via env, fallbacks for local dev)
jwt.private.key=${JWT_PRIVATE_KEY:classpath:certs/private.pem}
jwt.public.key=${JWT_PUBLIC_KEY:classpath:certs/public.pem}
jwt.access-token.expiration-ms=900000
jwt.refresh-token.expiration-ms=604800000
jwt.issuer=https://auth.medicare.internal

# Logging
logging.level.com.medicare.auth_service=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [TxID: %X{correlationId:-}] %msg%n
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG